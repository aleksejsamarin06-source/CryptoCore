[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "0.2.0"
description = "CLI-утилита для AES-128"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20.0",
]

[project.scripts]
cryptocore = "cryptocore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
